[package]
name = "gandalfd"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
async-trait = "0.1.91"
config = "0.15.25"
hickory-proto = "0.26.1"
hickory-resolver = "0.26.1"
hickory-server = "0.26.1"
reqwest = { version = "0.13.4", features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
mockito = "1.7.2"
proptest = "1.11.0"
tempfile = "3.27.0"
